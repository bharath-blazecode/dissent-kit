name: Behavior or packaging bug
description: Report an output, installation, or repository problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping make DissentKit more reliable. Remove private information before submitting.
  - type: input
    id: host
    attributes:
      label: Host and model
      description: Name the AI host and exact model when available.
      placeholder: Codex desktop, model name
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DissentKit version or commit
      placeholder: 0.3.0 or a commit SHA
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - Codex skill installer
        - Downloaded release ZIP
        - Cloned repository
        - Pasted universal prompt
        - Platform adapter
        - Other
    validations:
      required: true
  - type: textarea
    id: prompt
    attributes:
      label: Prompt that exposed the problem
      description: Provide the smallest prompt that reproduces the behavior.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Include the execution label and raw output when relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private, confidential, and identifying information.
          required: true
